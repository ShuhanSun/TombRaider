name: Game regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node --check game-optimizations.js
      - run: node --check game-patches.js
      - run: node --check puzzle-system.js
      - run: node --check puzzle-patches.js
      - run: node --check visual-polish.js
      - run: node --test tests/game.test.cjs tests/optimization-contract.test.cjs tests/puzzle-contract.test.cjs tests/visual-polish-contract.test.cjs
